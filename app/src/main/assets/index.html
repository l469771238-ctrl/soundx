<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الأصوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#2dff7e; --w:#fff; --wd:rgba(217,255,233,.78); --lt:#d9ffe9;
  --glass:rgba(255,255,255,.05); --gb:rgba(45,255,126,.28);
  --sh:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--w);
  font-family:"Cairo",Tahoma,sans-serif; font-size:14px;
  background:
    radial-gradient(circle at 14% 8%, rgba(45,255,126,.20), transparent 40%),
    radial-gradient(circle at 88% 88%, rgba(45,255,126,.11), transparent 45%),
    radial-gradient(circle at 85% 14%, rgba(255,255,255,.06), transparent 30%),
    #020504;
  background-attachment:fixed;
  padding:12px 12px calc(80px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px;margin:0 auto}
[hidden]{display:none!important}
.glass{
  background:var(--glass); border:1px solid var(--gb); border-radius:18px;
  backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--sh);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;margin-bottom:10px}
.top h1{margin:0;font-size:17px;font-weight:800;color:var(--g);text-shadow:0 0 14px rgba(45,255,126,.55)}
.status{position:fixed;z-index:20;right:12px;left:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;padding:8px 12px;font-size:12.5px;color:var(--lt);line-height:1.6;text-align:center;background:rgba(6,12,9,.9);opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .2s,transform .2s,visibility .2s;pointer-events:none}
.status.show{opacity:1;visibility:visible;transform:none}

.neon{
  position:relative; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  font:inherit; font-weight:700; font-size:13px; cursor:pointer;
  padding:7px 12px; border-radius:11px; border:2px solid var(--g);
  background:rgba(45,255,126,.07); color:var(--g); text-shadow:0 0 10px currentColor;
  box-shadow:0 0 14px rgba(45,255,126,.5), inset 0 0 10px rgba(45,255,126,.2);
  transition:transform .12s, box-shadow .15s;
}
.neon:hover{transform:translateY(-2px);box-shadow:0 0 26px rgba(45,255,126,.8), inset 0 0 14px rgba(45,255,126,.28)}
.neon:active{transform:scale(.97)}
.neon:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.neon input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.neon.ghost{border-color:rgba(255,255,255,.35);color:var(--w);text-shadow:none;background:rgba(255,255,255,.05);box-shadow:none}
.neon.ghost:hover{border-color:var(--w);box-shadow:0 0 14px rgba(255,255,255,.25)}

.block{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;margin-bottom:8px}
.badge{
  flex:0 0 44px;min-width:44px;height:44px;padding:0 5px;border-radius:12px;display:grid;place-items:center;
  font-size:21px;font-weight:800;color:var(--g);border:2px solid var(--g);
  background:rgba(45,255,126,.12); box-shadow:0 0 16px rgba(45,255,126,.5); text-shadow:0 0 10px currentColor;
}
.block.on .badge{animation:pulse .5s ease-out}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.info{flex:1 1 140px;min-width:0}
.fname{font-weight:700;font-size:14px;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.meta{font-size:11.5px;color:var(--wd);line-height:1.6}
.acts{display:flex;gap:6px;align-items:center;flex:1 1 100%}
.acts .play{flex:1}
.x{
  width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:var(--glass);
  color:var(--w);font-size:18px;line-height:1;cursor:pointer;font-family:inherit;
}
.x:hover{border-color:var(--w);box-shadow:0 0 12px rgba(255,255,255,.3)}
.add{width:100%;padding:9px;font-size:14px}
.sv{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:var(--glass);color:var(--w);font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
.sv:hover:not(:disabled){border-color:var(--g);box-shadow:0 0 12px rgba(45,255,126,.45)}
.sv:disabled{opacity:.3;cursor:not-allowed}
.sv.saved{border-color:var(--g);background:rgba(45,255,126,.16);color:var(--g);box-shadow:0 0 12px rgba(45,255,126,.5);font-weight:800}
.note{margin:0;min-height:18px;font-size:12px;color:var(--lt)}
.sbar{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:10px}
.sbar h1{margin:0;font-size:17px;font-weight:800;color:var(--g);text-shadow:0 0 14px rgba(45,255,126,.55);flex:1}
.sinfo{padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.sinfo .sub{margin:0;font-size:12px;color:var(--wd);line-height:1.6}
.rows>.sub{margin:14px 4px;font-size:13px;color:var(--wd)}
.srow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.srow .rt{flex:1}
.racts{display:flex;gap:6px;flex:0 0 auto}
.ib{min-width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:var(--glass);color:var(--w);font-size:16px;line-height:1;cursor:pointer;font-family:inherit}
.ib:hover{border-color:var(--g);color:var(--g);box-shadow:0 0 10px rgba(45,255,126,.4)}
.ib.go2{border-color:var(--g);color:var(--g)}
.ib.sure{border-color:var(--w);color:var(--w);background:rgba(255,255,255,.18);font-size:12px;padding:0 8px}

.vol{
  position:fixed;z-index:10;right:12px;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px;
}
.vol .mute{width:34px;height:34px;border-radius:11px;border:2px solid var(--g);background:rgba(45,255,126,.07);cursor:pointer;font-size:15px;
  box-shadow:0 0 12px rgba(45,255,126,.45)}
.pct{min-width:40px;text-align:center;font-weight:800;color:var(--w);font-size:12.5px}
input[type=range]{
  --p:80%;
  flex:1;height:7px;border-radius:7px;-webkit-appearance:none;appearance:none;outline:none;cursor:pointer;
  background:linear-gradient(to right,var(--g) var(--p),rgba(255,255,255,.16) var(--p));
  box-shadow:0 0 12px rgba(45,255,126,.4);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--g);box-shadow:0 0 16px var(--g);
}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--g);box-shadow:0 0 16px var(--g)}
:focus-visible{outline:3px solid var(--lt);outline-offset:2px}

/* قايمة اختيار الأصوات من الأرشيف */
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;gap:10px;padding:16px;background:rgba(8,14,11,.82)}
.sheet h2{margin:0;font-size:16px;color:var(--g);text-shadow:0 0 12px rgba(45,255,126,.5);overflow-wrap:anywhere}
.sheet .sub{margin:0;font-size:13px;color:var(--wd)}
.flt{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--gb);background:rgba(255,255,255,.06);color:var(--w);font:inherit;font-size:15px}
.rows{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:80px;padding:2px}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);cursor:pointer}
.row:has(input:checked){border-color:var(--g);background:rgba(45,255,126,.1);box-shadow:0 0 12px rgba(45,255,126,.25)}
.row input{-webkit-appearance:none;appearance:none;flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--g);background:transparent;display:grid;place-items:center;cursor:pointer}
.row input:checked{background:var(--g)}
.row input:checked::after{content:"✓";color:#020504;font-weight:800;font-size:15px;line-height:1}
.rt{min-width:0;display:flex;flex-direction:column}
.rt b{color:var(--w);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.rt small{color:var(--wd);font-size:12px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .neon{padding:6px 12px;font-size:13px}
.cnt{margin-inline-start:auto;font-size:13px;color:var(--wd)}
.btns{display:flex;gap:8px}
.btns .go{flex:1}
.tbtns{display:flex;gap:8px;align-items:center}
.neon.ic{width:36px;height:36px;padding:0;border-radius:11px}
.neon.ic svg{display:block;filter:drop-shadow(0 0 4px currentColor)}
.neon.ic.ghost svg{filter:none}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.exi{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:var(--glass);color:var(--w);text-decoration:none;min-width:0}
.exi:hover,.exi:focus-visible{border-color:var(--g);box-shadow:0 0 14px rgba(45,255,126,.4)}
.exic{flex:0 0 40px;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#eafff2;border:1px solid rgba(45,255,126,.5);box-shadow:0 0 10px rgba(45,255,126,.25);font-size:21px;line-height:1}
.exic img{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
.exn{min-width:0;display:flex;flex-direction:column}
.exn b{font-size:13.5px;color:var(--w);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exn small{font-size:11px;color:var(--wd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="viewMain" class="wrap">
  <header class="top glass"><h1>لوحة الأصوات</h1><span class="tbtns"><button id="stockBtn" class="neon ic" title="المخزون" aria-label="المخزون"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg></button><button id="exploreBtn" class="neon ic ghost" title="استكشف" aria-label="استكشف"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button></span></header>
  <main id="list"></main>
  <button id="add" class="neon add">+ بلوك جديد</button>
</div>

<div id="viewStock" class="wrap" hidden>
  <header class="sbar glass"><button id="stBack" class="neon ghost">→ رجوع</button><h1>المخزون</h1></header>
  <div class="sinfo glass">
    <p id="stSub" class="sub"></p>
    <p id="stNote" class="note"></p>
    <input id="stFlt" class="flt" type="search" placeholder="بحث بالاسم…">
    <div class="tools"><button id="stExp" class="neon ghost">تصدير المخزون كامل</button><label class="neon ghost">استيراد ملف مخزون<input id="stImp" type="file" accept=".zip,application/zip"></label></div>
  </div>
  <div id="stRows" class="rows"></div>
</div>

<div id="viewExplore" class="wrap" hidden>
  <header class="sbar glass"><button id="exBack" class="neon ghost">→ رجوع</button><h1>استكشف</h1></header>
  <div id="exGrid" class="exgrid"></div>
</div>

<div id="st" class="status glass" role="status" aria-live="polite"></div>

<footer class="vol glass">
  <button id="mute" class="mute" aria-label="كتم الصوت">🔊</button>
  <input id="range" type="range" min="0" max="100" value="80" dir="ltr" aria-label="مستوى الصوت">
  <span id="pct" class="pct">80%</span>
</footer>

<script>
/*ARC_START*/
var AUDIO_EXT=['wav','wave','mp3','ogg','oga','opus','m4a','m4b','aac','flac','weba','webm','mp4','aif','aiff','aifc','caf','3gp','amr','wma','mka','mp2'];
function ext(n){ var m=/\.([a-z0-9]+)$/i.exec(n||''); return m?m[1].toLowerCase():''; }

/* ترتيب الصيغ: الأفضل والأسرع أولًا. الملفات الصغيرة: الأعلى جودة وأسرع فك (WAV). الملفات الكبيرة: الأخف (OPUS/OGG/M4A). */
var SMALL=6*1048576;
var R_SMALL={wav:100,wave:100,flac:90,aif:85,aiff:85,aifc:85,caf:84,opus:80,ogg:78,oga:78,m4a:75,aac:74,mp3:70,weba:60,webm:60,mp4:50,'3gp':40,mka:35,mp2:30,m4b:30,amr:20,wma:10};
var R_BIG={opus:100,ogg:95,oga:95,m4a:90,aac:88,mp3:85,weba:80,webm:78,mp4:70,flac:60,wav:50,wave:50,aif:45,aiff:45,aifc:45,caf:44,'3gp':30,mka:25,mp2:20,m4b:20,amr:10,wma:5};
function rank(c){ return (c.size<=SMALL?R_SMALL:R_BIG)[c.ext]||0; }
function byBest(a,b){ return (rank(b)-rank(a))||(a.size-b.size); }

function noDeflate(){ throw new Error('المتصفح قديم ومش بيدعم فك الضغط، حدّثه أو استخدم ملف ZIP بدون ضغط'); }
async function inflateRaw(blob,fmt){
  if(typeof DecompressionStream==='undefined') noDeflate();
  return await new Response(blob.stream().pipeThrough(new DecompressionStream(fmt))).blob();
}

/* ZIP: بيقرا الفهرس من آخر الملف بس، ويفك الأصوات المطلوبة وحدها (مناسب للملفات الكبيرة). */
async function zipOpen(file){
  var size=file.size, tl=Math.min(size,65557+22+20);
  var tail=new DataView(await file.slice(size-tl,size).arrayBuffer()), e=-1, i;
  for(i=tail.byteLength-22;i>=0;i--){ if(tail.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error('ملف ZIP غير صالح أو تالف');
  var total=tail.getUint16(e+10,true), cdSize=tail.getUint32(e+12,true), cdOff=tail.getUint32(e+16,true);
  if((total===0xFFFF||cdSize===0xFFFFFFFF||cdOff===0xFFFFFFFF) && e>=20 && tail.getUint32(e-20,true)===0x07064b50){
    var z64=Number(tail.getBigUint64(e-20+8,true));
    var z=new DataView(await file.slice(z64,z64+56).arrayBuffer());
    total=Number(z.getBigUint64(32,true)); cdSize=Number(z.getBigUint64(40,true)); cdOff=Number(z.getBigUint64(48,true));
  }
  var cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer()), p=0, out=[], dec=new TextDecoder('utf-8');
  while(p+46<=cd.byteLength && cd.getUint32(p,true)===0x02014b50){
    var flags=cd.getUint16(p+8,true), method=cd.getUint16(p+10,true), cs=cd.getUint32(p+20,true), us=cd.getUint32(p+24,true),
        nl=cd.getUint16(p+28,true), el=cd.getUint16(p+30,true), cl=cd.getUint16(p+32,true), off=cd.getUint32(p+42,true);
    var name=dec.decode(new Uint8Array(cd.buffer,cd.byteOffset+p+46,nl));
    var ep=p+46+nl, ee=ep+el;
    while(ep+4<=ee){
      var id=cd.getUint16(ep,true), sz=cd.getUint16(ep+2,true), q=ep+4;
      if(id===1){
        if(us===0xFFFFFFFF){ us=Number(cd.getBigUint64(q,true)); q+=8; }
        if(cs===0xFFFFFFFF){ cs=Number(cd.getBigUint64(q,true)); q+=8; }
        if(off===0xFFFFFFFF){ off=Number(cd.getBigUint64(q,true)); q+=8; }
      }
      ep+=4+sz;
    }
    out.push(mkZipEntry(file,{path:name.replace(/\\/g,'/'),size:us,csize:cs,off:off,method:method,enc:!!(flags&1),dir:/\/$/.test(name)}));
    p+=46+nl+el+cl;
  }
  return out;
}
function mkZipEntry(file,e){
  e.read=async function(){
    if(e.enc) throw new Error('الملف مشفّر بكلمة سر');
    var h=new DataView(await file.slice(e.off,e.off+30).arrayBuffer());
    if(h.getUint32(0,true)!==0x04034b50) throw new Error('ملف ZIP تالف');
    var s=e.off+30+h.getUint16(26,true)+h.getUint16(28,true), blob=file.slice(s,s+e.csize);
    if(e.method===0) return blob;
    if(e.method===8) return await inflateRaw(blob,'deflate-raw');
    throw new Error('طريقة ضغط غير مدعومة ('+e.method+')');
  };
  return e;
}

/* TAR / TGZ */
async function tarOpen(blob){
  var out=[], pos=0, size=blob.size, longName=null, paxPath=null, dec=new TextDecoder('utf-8');
  function str(h,a,n){ var s=h.subarray(a,a+n), z=s.indexOf(0); return dec.decode(z<0?s:s.subarray(0,z)); }
  while(pos+512<=size){
    var h=new Uint8Array(await blob.slice(pos,pos+512).arrayBuffer());
    if(h.every(function(b){return b===0;})) break;
    var sz;
    if(h[124]&0x80){ sz=0; for(var k=125;k<136;k++) sz=sz*256+h[k]; }
    else sz=parseInt(str(h,124,12).trim()||'0',8);
    var type=String.fromCharCode(h[156]||48), name=str(h,0,100);
    if(h[257]===0x75&&h[258]===0x73&&h[259]===0x74&&h[260]===0x61&&h[261]===0x72&&h[262]===0){ var pre=str(h,345,155); if(pre) name=pre+'/'+name; }
    var dpos=pos+512, adv=Math.ceil(sz/512)*512;
    if(type==='L'){ longName=dec.decode(new Uint8Array(await blob.slice(dpos,dpos+sz).arrayBuffer())).replace(/\0+$/,''); }
    else if(type==='x'){ var m=/\d+ path=([^\n]*)\n/.exec(dec.decode(new Uint8Array(await blob.slice(dpos,dpos+sz).arrayBuffer()))); if(m) paxPath=m[1]; }
    else if(type==='g'){ /* رأس عام: نتجاهله */ }
    else {
      var nm=paxPath||longName||name; longName=null; paxPath=null;
      if(type==='0'||type==='\0'||type==='7'){ out.push(mkTarEntry(blob,{path:nm.replace(/\\/g,'/'),size:sz,off:dpos,dir:false})); }
    }
    pos=dpos+adv;
  }
  return out;
}
function mkTarEntry(blob,e){ e.read=async function(){ return blob.slice(e.off,e.off+e.size); }; return e; }

/* بيجمّع الملفات اللي ليها نفس الاسم (صيغ مختلفة لنفس الصوت) في "عيلة" واحدة */
function groupFamilies(entries){
  var map={}, order=[];
  entries.forEach(function(e){
    if(e.dir) return;
    var base=e.path.split('/').pop();
    if(!base||base.charAt(0)==='.'||/(^|\/)__MACOSX\//.test(e.path)) return;
    var x=ext(base); if(AUDIO_EXT.indexOf(x)<0) return;
    var key=e.path.slice(0,e.path.length-x.length-1).toLowerCase();
    if(!map[key]){ map[key]={name:base.slice(0,base.length-x.length-1),cands:[],from:''}; order.push(key); }
    map[key].cands.push({ext:x,size:e.size,read:e.read});
  });
  return order.map(function(k){ map[k].cands.sort(byBest); return map[k]; });
}

/* CRC32 + بناء ZIP (بدون ضغط لأن الصوت مضغوط أصلًا) — بيستخدم في تصدير المخزون */
var CRC_T=null;
function crc32(u8){
  if(!CRC_T){ CRC_T=new Uint32Array(256); for(var n=0;n<256;n++){ var c0=n; for(var k=0;k<8;k++) c0=(c0&1)?(0xEDB88320^(c0>>>1)):(c0>>>1); CRC_T[n]=c0>>>0; } }
  var c=0xFFFFFFFF; for(var i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipBuild(files){
  var enc=new TextEncoder(), parts=[], central=[], off=0, cdSize=0, d=new Date();
  var dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(function(f){

      var buf=await decodeP(await blob.arrayBuffer()), s=AC().createBufferSource();
      s.buffer=buf; s.connect(master); s.onended=function(){ if(prevSrc===s) prevSrc=null; };
      s.start(0); prevSrc=s;
    }
  }

  async function exportStock(note){
    var recs=(await stList()).sort(function(a,b){ return (a.added||0)-(b.added||0); });
    if(!recs.length){ note('المخزون فاضي، مفيش حاجة تتصدّر'); return; }
    note('جاري تجهيز الملف…');
    var used={}, files=[], items=[];
    for(var i=0;i<recs.length;i++){
      var r=recs[i], ab=await stGet(r.id); if(!ab) continue;
      var base=safe(r.name), fn=base+'.'+r.ext, k=1;
      while(used[fn.toLowerCase()]){ k++; fn=base+' ('+k+').'+r.ext; }
      used[fn.toLowerCase()]=1;
      files.push({name:'sounds/'+fn,data:ab});
      items.push({file:'sounds/'+fn,id:r.id,name:r.name,ext:r.ext,size:r.size,added:r.added});
    }
    files.unshift({name:'sound-stock.json',data:new TextEncoder().encode(JSON.stringify({app:'sound-pad',v:1,items:items},null,1))});
    var blob=zipBuild(files);
    dl(blob,'sound-stock-'+new Date().toISOString().slice(0,10)+'.zip');
    note('تم تصدير '+items.length+' صوت ('+size(blob.size)+'). احتفظ بالملف كنسخة احتياطية، وتقدر ترجّعه بزرار الاستيراد.');
  }
  async function importStock(f,note){
    note('جاري قراءة '+f.name+'…');
    try{
      var items=await stockParse(f);
      if(!items.length){ note('مفيش أصوات في الملف ده'); return 0; }
      var added=0, dup=0;
      for(var i=0;i<items.length;i++){
        var it=items[i], ab=await (await it.read()).arrayBuffer(), id=stockId(ab);
        if(await stHas(id)){ dup++; continue; }
        await stPut({id:id,name:it.name,ext:it.ext,size:ab.byteLength,added:it.added||Date.now()},ab); added++;
      }
      note('تم استيراد '+added+' صوت'+(dup?' ('+dup+' كانوا موجودين)':''));
      return added;
    }catch(e){ note('تعذّر الاستيراد: '+((e&&e.message)||'ملف غير صالح')); return 0; }
  }

  var viewMain=document.getElementById('viewMain'), viewStock=document.getElementById('viewStock');
  var stSub=document.getElementById('stSub'), stNote=document.getElementById('stNote'), stRows=document.getElementById('stRows'), stFlt=document.getElementById('stFlt');
  var stockOpen=false, pushed=false, savedY=0;
  function note(m){ stNote.textContent=m; }
  function iconBtn(txt,title,cls){ var x=document.createElement('button'); x.className='ib'+(cls?' '+cls:''); x.textContent=txt; x.title=title; x.setAttribute('aria-label',title); return x; }
  function mkRow(rec){
    var row=document.createElement('div'); row.className='srow';
    var tx=document.createElement('span'); tx.className='rt';
    var nm=document.createElement('b'); nm.textContent=rec.name;
    var sm=document.createElement('small');
    sm.textContent=rec.ext.toUpperCase()+' · '+size(rec.size)+(rec.added?' · '+new Date(rec.added).toLocaleDateString('ar-EG'):'');
    tx.appendChild(nm); tx.appendChild(sm);
    var acts=document.createElement('span'); acts.className='racts';
    var bp=iconBtn('▶','تشغيل','go2'), ba=iconBtn('＋','فتح في بلوك جديد'), bd=iconBtn('⬇','حفظ على الجهاز'), bx=iconBtn('🗑','حذف من المخزون');
    bp.addEventListener('click',function(){ previewRec(rec).catch(function(e){ note('فشل التشغيل: '+e.message); }); });
    ba.addEventListener('click',function(){ var b=openFromStock(rec); if(b) note('اتفتح «'+rec.name+'» في البلوك '+b.l); });
    bd.addEventListener('click',function(){ stockBlob(rec).then(function(bl){ dl(bl,safe(rec.name)+'.'+rec.ext); note('اتنزّل «'+rec.name+'.'+rec.ext+'» على جهازك'); }).catch(function(e){ note(e.message); }); });
    bx.addEventListener('click',function(){
      if(!bx.dataset.sure){
        bx.dataset.sure='1'; bx.textContent='تأكيد؟'; bx.classList.add('sure');
        setTimeout(function(){ if(bx.isConnected&&bx.dataset.sure){ delete bx.dataset.sure; bx.textContent='🗑'; bx.classList.remove('sure'); } },3000);
        return;
      }
      stDel(rec.id).then(function(){
        blocks.forEach(function(b){ if(b.libId===rec.id){ b.libId=null; markSaved(b,false); } });
        note('اتحذف «'+rec.name+'» من المخزون'); render();
      });
    });
    acts.appendChild(bp); acts.appendChild(ba); acts.appendChild(bd); acts.appendChild(bx);
    row.appendChild(tx); row.appendChild(acts);
    return row;
  }
  async function render(){
    var recs=(await stList()).sort(function(a,b){ return (b.added||0)-(a.added||0); });
    var tot=recs.reduce(function(s,r){ return s+(r.size||0); },0), q=stFlt.value.trim().toLowerCase();
    stSub.textContent=recs.length+' صوت · '+size(tot)+(memMode
      ? ' — التخزين المحلي مش متاح هنا، فالمخزون مؤقت لحد ما تقفل الصفحة. استخدم التصدير.'
      : ' — محفوظ جوه المتصفح على جهازك. المتصفح ممكن يمسح بياناته، فصدّر المخزون من وقت للتاني.');
    stRows.textContent='';
    if(!recs.length){ var em=document.createElement('p'); em.className='sub'; em.textContent='المخزون فاضي. اضغط أيقونة 💾 في أي بلوك لحفظ صوته هنا.'; stRows.appendChild(em); }
    recs.forEach(function(rec){ if(q&&rec.name.toLowerCase().indexOf(q)<0) return; stRows.appendChild(mkRow(rec)); });
    refreshCount();
  }
  function showStock(){
    if(stockOpen) return;
    stockOpen=true; savedY=window.scrollY||0;
    viewMain.hidden=true; viewStock.hidden=false; note(''); window.scrollTo(0,0); render();
  }
  function hideStock(){
    if(!stockOpen) return;
    stockOpen=false; stopPrev();
    viewStock.hidden=true; viewMain.hidden=false; window.scrollTo(0,savedY);
  }
  async function openStock(){
    await storeInit(); showStock();
    try{ history.pushState({stock:1},''); pushed=true; }catch(e){ pushed=false; }
  }
  function closeStock(){
    if(pushed){ pushed=false; try{ history.back(); setTimeout(hideStock,350); return; }catch(e){} }
    hideStock();
  }
  window.addEventListener('popstate',function(){ pushed=false; hideStock(); });
  stockBtn.addEventListener('click',openStock);
  document.getElementById('stBack').addEventListener('click',closeStock);
  stFlt.addEventListener('input',render);
  document.getElementById('stExp').addEventListener('click',function(){ exportStock(note).catch(function(err){ note('تعذّر التصدير: '+err.message); }); });
  var stImp=document.getElementById('stImp');
  stImp.addEventListener('change',function(){ var f=stImp.files[0]; stImp.value=''; if(f) importStock(f,note).then(render); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&stockOpen) closeStock(); });

  /* ---------- استكشف: مواقع أصوات ---------- */

    ['Mixkit','https://mixkit.co/free-sound-effects/','🎛️',''],
    ['Freesound','https://freesound.org/','🌊',''],

    ['Sonniss','https://sonniss.com/gameaudiogdc/','🎤','GDC Game Audio'],

  ];
  var viewExplore=document.getElementById('viewExplore'), exploreOpen=false, exPushed=false, exY=0, exBuilt=false;
  function mkIcon(site){
    var tile=document.createElement('span'); tile.className='exic';
    var host='', home='';
    try{ var u=new URL(site[1]); host=u.hostname; home=new URL('/favicon.ico',u).href; }catch(e){}
    var srcs=host?['https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=128','https://icons.duckduckgo.com/ip3/'+host+'.ico',home]:[];
    function fallback(){ tile.textContent=site[2]; tile.classList.add('emo'); }
    if(!srcs.length){ fallback(); return tile; }
    var img=document.createElement('img'), i=0;
    img.alt=''; img.loading='lazy'; img.referrerPolicy='no-referrer';
    function next(){ i++; if(i<srcs.length) img.src=srcs[i]; else { img.remove(); fallback(); } }
    img.onerror=next;
    img.onload=function(){ if(i===0&&img.naturalWidth<32) next(); };
    img.src=srcs[0];
    tile.appendChild(img);
    return tile;
  }
  function buildExplore(){
    if(exBuilt) return; exBuilt=true;
    var grid=document.getElementById('exGrid');
    SITES.forEach(function(site){
      var a=document.createElement('a'); a.className='exi'; a.href=site[1]; a.target='_blank'; a.rel='noopener noreferrer';
      a.title=site[0]+(site[3]?' · '+site[3]:'');
      var tx=document.createElement('span'); tx.className='exn';
      var nm=document.createElement('b'); nm.textContent=site[0]; tx.appendChild(nm);
      if(site[3]){ var sm=document.createElement('small'); sm.textContent=site[3]; tx.appendChild(sm); }
      a.appendChild(mkIcon(site)); a.appendChild(tx); grid.appendChild(a);
    });
  }
  function showExplore(){
    if(exploreOpen||stockOpen) return;
    exploreOpen=true; exY=window.scrollY||0;
    viewMain.hidden=true; viewExplore.hidden=false; window.scrollTo(0,0);
  }
  function hideExplore(){
    if(!exploreOpen) return;
    exploreOpen=false; viewExplore.hidden=true; viewMain.hidden=false; window.scrollTo(0,exY);
  }
  function openExplore(){
    buildExplore(); showExplore();
    try{ history.pushState({explore:1},''); exPushed=true; }catch(e){ exPushed=false; }
  }
  function closeExplore(){
    if(exPushed){ exPushed=false; try{ history.back(); setTimeout(hideExplore,350); return; }catch(e){} }
    hideExplore();
  }
  window.addEventListener('popstate',function(){ exPushed=false; hideExplore(); });
  document.getElementById('exploreBtn').addEventListener('click',openExplore);
  document.getElementById('exBack').addEventListener('click',closeExplore);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&exploreOpen) closeExplore(); });

  /* ---------- مستوى الصوت ---------- */
  function applyVol(){
    var v=eff();
    if(master) master.gain.value=v;
    blocks.forEach(function(b){ if(b.cur&&b.cur.a) b.cur.a.volume=v; });
    if(prevSrc&&prevSrc.a) prevSrc.a.volume=v;
    range.style.setProperty('--p',Math.round(vol*100)+'%');
    pct.textContent=muted?'صامت':Math.round(vol*100)+'%';
    muteBtn.textContent=(muted||vol===0)?'🔇':'🔊';
  }
  range.addEventListener('input',function(){ vol=range.value/100; muted=false; applyVol(); });
  muteBtn.addEventListener('click',function(){ muted=!muted; applyVol(); });

  document.getElementById('add').addEventListener('click',addBlock);
  document.addEventListener('keydown',function(e){
    var t=e.target&&e.target.tagName;
    if(stockOpen||exploreOpen) return;
    if(t==='INPUT'||t==='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey) return;
    var k=(e.key||'').toUpperCase();
    blocks.forEach(function(b){ if(b.l===k) play(b); });
  });
  document.addEventListener('dragover',function(e){ e.preventDefault(); });
  document.addEventListener('drop',function(e){
    e.preventDefault();
    var fs=Array.prototype.slice.call((e.dataTransfer&&e.dataTransfer.files)||[]);
    if(fs.length) ingest(fs,null);
  });

  addBlock(); applyVol(); refreshCount();
})();
